name: Docker

on:
  workflow_call: 

jobs:

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Build
      uses: docker/setup-buildx-action@v4.4.1

    - name: Download a Build Artifact
      uses: actions/download-artifact@v8.0.2
      with:
    # Name of the artifact to download. If unspecified, all artifacts for the run are downloaded.
        name: programa
        
    - name: Docker Login
      uses: docker/login-action@v4.8.0
      with:
        username: cauaaguiar12
        password: ${{ secrets.PASSWORD_DOCKER_HUB }}
        
    - name: Build and push Docker images
  # You may pin to the exact commit or the version.
  # uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      uses: docker/build-push-action@v7.4.0
      with:
    # Build's context is the set of files located in the specified PATH or URL
        context: .
    # Path to the Dockerfile
        file: ./Dockerfile
    # Push is a shorthand for --output=type=registry
        push: true
    # List of tags
        tags: cauaaguiar12/go_ci:${{github.ref_name}}
